name: backend pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, modification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: backend-checks-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      IMAGE: kostay-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Typecheck and build production image
        shell: bash
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE" .
      - name: Export tested image for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker image save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/backend.tar.gz"
      - name: Store tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ github.sha }}
          path: ${{ runner.temp }}/backend.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: Deploy backend
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: production-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Reject a superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'Main has moved; deploy the newer workflow run instead.' >&2
            exit 1
          fi
      - name: Deploy the exact tested image
        env:
          LIGHTSAIL_DEPLOY_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_KEY }}
        shell: bash
        run: bash deploy/send-image.sh "$RUNNER_TEMP/release/backend.tar.gz"
