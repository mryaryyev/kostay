services:
  kostay-api:
    container_name: kostay-api
    restart: always
    build: .
    image: kostay-server
    ports:
      - 4001:3007
    env_file: .env
    volumes:
      # Uploaded images stay on the host, so they survive new deploys
      - ./uploads:/app/uploads
    environment:
      REDIS_URL: redis://kostay-redis:6379
      TZ: Asia/Seoul
    depends_on:
      - kostay-redis
    networks:
      - monorepo-network

  kostay-batch:
    container_name: kostay-batch
    restart: unless-stopped
    # Same image as kostay-api (built once, reused from cache)
    build: .
    image: kostay-server
    command: ["node", "dist/apps/kostay-batch/main"]
    ports:
      - 4002:3008
    env_file: .env
    environment:
      REDIS_URL: redis://kostay-redis:6379
      TZ: Asia/Seoul
    depends_on:
      - kostay-api
      - kostay-redis
    networks:
      - monorepo-network

  kostay-redis:
    container_name: kostay-redis
    restart: always
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - monorepo-network

networks:
  monorepo-network:
    driver: bridge

volumes:
  redis-data:
